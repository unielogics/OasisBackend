# Written by install.sh --aws-runtime user (docs/deployment.md, ADR 0133); removed again by install.sh --aws-runtime role.
# The oasis-app key lives in /etc/oasis/aws-credentials, owner root, mode 0600. systemd reads it as root and gives this service a
# private copy that only the service user can read; the AWS SDK finds it through AWS_SHARED_CREDENTIALS_FILE, and never asks the
# instance metadata service.
[Service]
LoadCredential=aws-credentials:/etc/oasis/aws-credentials
Environment=AWS_SHARED_CREDENTIALS_FILE=%d/aws-credentials
Environment=AWS_EC2_METADATA_DISABLED=true
